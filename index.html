<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CleanCode Refactoring Critic AI</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>⚡ CleanCode Refactoring Critic</h1>
        <p>Instantly review performance flaws, bugs, and micro-optimizations</p>
    </div>

    <div class="container">
        <div class="config-bar">
            <div class="selector-group">
                <label for="languageSelect">Target Engine:</label>
                <select id="languageSelect" onchange="updatePlaceholder()">
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            <button onclick="analyzeCode()">Analyze Infrastructure</button>
        </div>

        <div class="editor-workspace">
            <div class="window-panel">
                <div class="window-header">
                    <div class="window-dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                    <div class="window-title" id="editorTitle">source_code.js</div>
                </div>
                <textarea id="codeInput">// Paste your code here to analyze...
function processData(arr) {
    let result = [];
    for(let i = 0; i < arr.length; i++) {
        if(arr[i] % 2 === 0) {
            result.push(arr[i] * 2);
        }
    }
    return result;
}</textarea>
            </div>

            <div class="window-panel">
                <div class="window-header">
                    <div class="window-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="window-title">critic_ai_feedback</div>
                </div>
                <div id="codeOutput" class="output-view">Your optimization matrix and refactored code will appear here after analysis...</div>
            </div>
        </div>
    </div>

    <!-- Official Google Web Bundle (Loads the global window.GoogleGenAI library smoothly) -->
    <script src="https://unpkg.com"></script>
    <script src="script.js"></script>
</body>
</html>
